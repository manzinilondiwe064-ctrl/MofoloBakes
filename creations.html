<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creations - Bella's Bakes</title>
<style>
body{margin:0;font-family:Arial;background:#fff8f0}
nav{background:#3e2723;padding:15px;display:flex;justify-content:space-between;align-items:center}
nav a{color:#ffd700;text-decoration:none;margin:0 10px;font-weight:bold}
h1{text-align:center;color:#d81b60;margin-top:20px}
.search-box{text-align:center;margin:20px}
.search-box input{padding:12px;width:320px;border-radius:25px;border:2px solid #d81b60}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}
.card{background:white;padding:15px;border-radius:15px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,0.15);transition:0.3s}
.card:hover{transform:scale(1.05)}
.card img{width:100%;height:200px;object-fit:cover;border-radius:10px;cursor:pointer}
.card h3{color:#3e2723;margin:10px 0 5px}
.card p{margin:5px}
.price{font-weight:bold;color:#d81b60;font-size:18px}
.btn{display:inline-block;background:#d81b60;color:white;padding:10px 25px;border-radius:25px;text-decoration:none;margin-top:10px;font-weight:bold}
#lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);text-align:center;z-index:999;padding-top:30px}
#lightbox img{max-width:90%;max-height:85%;border-radius:15px}
</style>
</head>
<body>
<nav>
<a href="index.html" style="font-size:22px">Bella's Bakes</a>
<div>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="creations.html">Creations</a>
<a href="enquiry.html">Order</a>
<a href="contact.html">Contact</a>
</div>
</nav>

<h1>Our Luxury Cake Collection</h1>
<p style="text-align:center">Click picture to enlarge | Click Order to order</p>

<div class="search-box">
<input type="text" id="cake-search" placeholder="Search cakes... chocolate, vanilla, strawberry">
</div>

<div id="cake-gallery" class="gallery"></div>

<div id="lightbox" onclick="this.style.display='none'">
<img id="lightbox-img" src="">
<p style="color:white">Click anywhere to close</p>
</div>

<script>
const cakes = [
 {name:"Midnight Gold Drip", price:"R550", desc:"Dark chocolate with 24k gold drip - our best seller!", img:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400"},
 {name:"Red Velvet Royal", price:"R500", desc:"Classic red velvet with cream cheese frosting", img:"https://images.unsplash.com/photo-1588195538326-c5b1e9f80a1b?w=400"},
 {name:"Vanilla Dream Cloud", price:"R450", desc:"Soft vanilla sponge with buttercream clouds", img:"https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=400"},
 {name:"Strawberry Blush", price:"R480", desc:"Fresh strawberry layers with pink frosting", img:"https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=400"},
 {name:"Caramel Goddess", price:"R520", desc:"Salted caramel & toffee - rich and decadent", img:"https://images.unsplash.com/photo-1621303837174-89787a7d4729?w=400"},
 {name:"Lemon Zest Bliss", price:"R460", desc:"Zesty lemon cake with lemon curd filling", img:"https://images.unsplash.com/photo-1519869325930-281384150729?w=400"}
];

function displayCakes(list){
 const gal=document.getElementById('cake-gallery');
 gal.innerHTML='';
 list.forEach(c=>{
  const div=document.createElement('div');
  div.className='card';
  div.innerHTML=`<img src="${c.img}" alt="${c.name}"><h3>${c.name}</h3><p class="price">${c.price}</p><p>${c.desc}</p><a href="enquiry.html" class="btn">Order Now</a>`;
  div.querySelector('img').onclick=()=>{
    document.getElementById('lightbox').style.display='block';
    document.getElementById('lightbox-img').src=c.img;
  };
  gal.appendChild(div);
 });
}
displayCakes(cakes);

document.getElementById('cake-search').addEventListener('input',function(){
 const term=this.value.toLowerCase();
 const filtered=cakes.filter(c=>c.name.toLowerCase().includes(term) || c.desc.toLowerCase().includes(term));
 displayCakes(filtered);
});
</script>

</body>
</html>
